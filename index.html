<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1F5D3A">
  <meta name="description" content="AgroAlerta: registra observaciones de tus cultivos, prepara evidencia y sigue tus casos.">
  <title>AgroAlerta · Cuidamos lo que cultivas</title>
  <link rel="icon" href="iconos/hoja.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilos.css">
  <script defer src="js/datos.js"></script>
  <script defer src="js/script.js"></script>
</head>
<body>
  <a class="skip" href="#main">Saltar al contenido</a>
  <template id="plantilla-parcelas">
<div class="p02"><section id="inicio-parcelas" class="bienvenida">
      <div class="bienvenida-texto">
        <p class="etiqueta-superior">Gestión de parcelas</p>
        <h1 tabindex="-1">Mis parcelas</h1>
        <p>Registra tus cultivos y abre el historial de observaciones de cada parcela.</p>
      </div>

      
      <figure class="imagen imagen-hero"><img src="imagenes/hero-agricola.jpg" alt="Hileras de hortalizas de hoja cultivadas en campo"></figure>
    </section>

    
    <section id="registrar-parcela" class="formulario-tarjeta">
      <h2>Registrar parcela</h2>
      <p>Indica el nombre y el cultivo. Puedes añadir un distrito o sector.</p>

      <form id="parcel-form" novalidate>
          <div class="form-error" role="alert" tabindex="-1" hidden></div>
        <div class="campo">
          <label for="parcelName">Nombre de la parcela <span class="requisito">(obligatorio)</span></label>
          <input type="text" id="parcelName" name="parcelName" maxlength="80" placeholder="Ej.: Parcela Norte" required>
        </div>

        <div class="campo">
          <label for="crop">Cultivo <span class="requisito">(obligatorio)</span></label>
          <input type="text" id="crop" name="crop" list="hortalizas" required maxlength="80" placeholder="Ej.: Lechuga">
          <datalist id="hortalizas"><option>Lechuga</option><option>Tomate</option><option>Ají</option><option>Cebolla</option><option>Papa</option></datalist>
        </div>

        <div class="campo">
          <label for="zone">Zona <span class="requisito">(opcional)</span></label>
          <input type="text" id="zone" name="zone" maxlength="100" placeholder="Ej.: Valle del Mantaro">
        </div>

        <div class="acciones">
          
          <button class="button primary" type="submit">Registrar parcela</button>
          
        </div>
      </form>
    </section>

    <section class="mis-parcelas" aria-labelledby="tus-parcelas"><h2 id="tus-parcelas">Parcelas registradas</h2><div class="lista-parcelas"></div></section></div>
</template>
  <div id="app"></div>
  <div id="announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <dialog id="image-dialog" aria-label="Fotografía ampliada"><button class="button secondary" id="close-image">Cerrar imagen</button><img alt="Fotografía del caso ampliada" id="full-image"></dialog>
  <noscript>Activa JavaScript para abrir tu cuaderno de campo.</noscript>
</body>
</html>
